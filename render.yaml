services:
  - type: web
    name: enrichment-lookup-coordinator
    env: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: DAILY_QUOTA_LIMIT
        value: "10"
      - key: LEASE_DURATION_SECONDS
        value: "300"
      - key: REAPER_INTERVAL_MS
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: enrichment-db
          property: connectionString

databases:
  - name: enrichment-db
    databaseName: enrichment_coordinator
    user: coordinator_user
    plan: free

