version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: enrichment_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: enrichment_coordinator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enrichment_coordinator"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enrichment_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/enrichment_coordinator
      DAILY_QUOTA_LIMIT: 10
      LEASE_DURATION_SECONDS: 300
      REAPER_INTERVAL_MS: 3000
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  postgres_data:

